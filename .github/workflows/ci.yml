name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Update packaging tools
        run: python -m pip install --upgrade pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Static syntax check
        run: python -m compileall -q app tests
      - name: Dependency security audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit
      - name: Run tests
        run: python -m pytest -q

  shell:
    name: Release guard and shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate release candidate
        run: python3 scripts/check_release.py
      - name: Validate start script
        run: bash -n start.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Test live filler totals
        run: npm run test:live-filler
      - name: Test recorder resampler
        run: npm run test:resampler
