name: 功能建议
description: 提议一个能改善训练闭环、可解释性、隐私或首次体验的改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。不要在建议中提交真实训练材料、录音、简历或 API Key。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明具体使用者、场景和当前阻碍，而不只描述想要的实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的体验或行为
      description: 描述使用者可观察到的结果，以及不应改变的行为边界。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据或替代方案（可选）
      description: 可说明训练样本、可复现数据、设计取舍或你已经考虑过的替代方案。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，且没有找到相同建议。
          required: true
        - label: 此建议不包含任何密钥、个人信息或受限材料。
          required: true
